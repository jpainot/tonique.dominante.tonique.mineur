<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i – V7 – i · 12 tonalités</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;text-align:center;color:#20242a}h1{font-size:1.5rem}#display{font-size:clamp(2.6rem,8vw,5rem);font-weight:700;margin:30px 0;min-height:1.4em}#model{max-width:100%;max-height:290px;object-fit:contain}button{font:inherit;padding:12px 20px;margin:6px;border:1px solid #aaa;border-radius:10px;background:#f5f5f5;cursor:pointer}button.primary{background:#172b4d;color:white}#bar{height:10px;background:#e4e6e9;border-radius:9px;overflow:hidden;margin:20px auto;max-width:450px}#fill{height:100%;width:0;background:#355d95}#status{color:#555}label{display:inline-block;margin:10px}input{width:75px;padding:7px;font:inherit}</style></head><body><h1>Enchaînement i – V7 – i</h1><section id="intro"><p><strong>Effectuer ceci dans la tonalité demandée :</strong></p><img id="model" src="modele.png" alt="Modèle musical de l'enchaînement i – V7 – i avec mouvement des voix par ton et demi-ton"></section><div id="display" aria-live="polite"></div><p id="status">12 tonalités mineures · ordre aléatoire sans répétition</p><div id="bar"><div id="fill"></div></div><label>Durée (secondes) <input id="seconds" type="number" min="2" max="30" value="6"></label><div><button class="primary" id="start">Démarrer</button><button id="pause" disabled>Pause</button><button id="reset">Recommencer</button></div><script>const notes=['Do mineur','Do♯ mineur','Ré mineur','Mi♭ mineur','Mi mineur','Fa mineur','Fa♯ mineur','Sol mineur','Sol♯ mineur','La mineur','Si♭ mineur','Si mineur'];let deck=[],index=-1,running=false,elapsed=0,last=0,frame=0;const display=document.querySelector('#display'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),intro=document.querySelector('#intro'),start=document.querySelector('#start'),pause=document.querySelector('#pause'),seconds=document.querySelector('#seconds');function shuffle(){deck=[...notes];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function duration(){return Math.max(2,Math.min(30,Number(seconds.value)||6))*1000}function next(){index++;elapsed=0;fill.style.width='0%';if(index>=deck.length){running=false;display.textContent='Terminé !';status.textContent='12 tonalités parcourues';start.disabled=false;pause.disabled=true;return}display.textContent=deck[index];status.textContent=`Tonalité ${index+1} / 12`}function tick(t){if(!running)return;if(!last)last=t;elapsed+=t-last;last=t;const d=duration();if(elapsed>=d){next();if(!running)return}fill.style.width=Math.min(100,elapsed/d*100)+'%';frame=requestAnimationFrame(tick)}function play(){if(index<0||index>=deck.length){shuffle();index=-1;next()}intro.hidden=true;running=true;last=0;start.disabled=true;pause.disabled=false;pause.textContent='Pause';frame=requestAnimationFrame(tick)}start.addEventListener('click',play);pause.addEventListener('click',()=>{if(running){running=false;cancelAnimationFrame(frame);pause.textContent='Reprendre'}else{running=true;last=0;pause.textContent='Pause';frame=requestAnimationFrame(tick)}});document.querySelector('#reset').addEventListener('click',()=>{running=false;cancelAnimationFrame(frame);index=-1;elapsed=0;last=0;intro.hidden=false;display.textContent='';status.textContent='12 tonalités mineures · ordre aléatoire sans répétition';fill.style.width='0%';start.disabled=false;pause.disabled=true;pause.textContent='Pause'});</script></body></html>
